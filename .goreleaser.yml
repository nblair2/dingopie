version: 2

project_name: dingopie

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
      # Garble everything except for:
      # go-packet   (takes too long)
      # go-cmp      (only used in tests)
      # cobra,pflag (uses reflection for commands)
      - GOGARBLE=github.com/coreos/go-iptables,github.com/creack/pty,github.com/florianl/go-nfqueue,github.com/nblair2/go-dnp3/v2,github.com/schollz/progressbar/v3,golang.org/x/term
    # Trick goreleaser into using garble as the build tool
    tool: garble
    command: "-literals"
    flags:
      # Makefile and ci should both set and record the GARBLE_SEED
      - -seed={{ envOrDefault "GARBLE_SEED" "random" }}
      - build
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - windows
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - ppc64
      - ppc64le
      - mips
      - mipsle
      - mips64
      - mips64le
    goarm:
      - "5"
      - "6"
      - "7"
    gomips:
      - hardfloat
      - softfloat
    ignore:
      # https://github.com/golang/go/issues/70705
      - goos: windows
        goarch: arm

archives:
  - formats:
      - gz
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - none*

release:
  draft: false
  prerelease: false
  make_latest: true
  footer: |
    ---
    Garble Seed: `{{ .Env.GARBLE_SEED }}`

changelog:
  groups:
    - title: Breaking Changes
      regexp: '^.*!:'
      order: 0
    - title: Documentation
      regexp: '^doc'
      order: 1
    - title: Features
      regexp: '^feat'
      order: 2
    - title: Bug Fixes
      regexp: '^fix'
      order: 3
    - title: Performance Improvements
      regexp: '^perf'
      order: 4
    - title: Refactoring
      regexp: '^refac'
      order: 5
    - title: Testing, Builds, CI
      regexp: '^(test|build|ci)'
      order: 6
    - title: Other Changes
      order: 999
