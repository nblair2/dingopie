name: ci

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/ci.yml'

jobs:

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load tool versions
        run: cat .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load tool versions
        run: cat .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install gocover-cobertura
        run: go install github.com/boumenot/gocover-cobertura@${{ env.GOCOVERCOBERTURA_VERSION }}
      - name: Run unit tests
        run: make test-unit

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Load tool versions
        run: cat .github/versions.env >> "$GITHUB_ENV"
      - name: Install codespell
        run: pip install --user "codespell==${{ env.CODESPELL_VERSION }}"
      - name: Run codespell
        run: codespell -I .codespellignore

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Load tool versions
        run: cat .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install garble
        run: go install mvdan.cc/garble@${{ env.GARBLE_VERSION }}
      - name: Cache garble build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/garble
          key: garble-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.GARBLE_VERSION }}-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            garble-${{ matrix.goos }}-${{ matrix.goarch }}-${{ env.GARBLE_VERSION }}-${{ env.GO_VERSION }}-
      - name: Generate garble seed
        run: |
          SEED=$(openssl rand -base64 8 | tr -d '=')
          echo "GARBLE_SEED=$SEED"
          echo "GARBLE_SEED=$SEED" >> "$GITHUB_ENV"
      - name: Build via GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: build --snapshot --clean --single-target
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  test-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
      - name: Run tests
        shell: bash
        run: |
          EXECUTABLE=$(pwd)/$(find dist/ -path "*${{ matrix.goos }}*${{ matrix.goarch }}*" -name dingopie -type f | head -n 1)
          if [ -z "$EXECUTABLE" ]; then
            echo "Error: Could not find dingopie binary in dist/"
            exit 1
          fi
          echo "dingopie binary found at: $EXECUTABLE"
          chmod +x $EXECUTABLE
          make test EXECUTABLE=$EXECUTABLE

  test-windows:
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-windows-amd64
          path: dist/
      - name: Run tests
        run: |
          $exe = (Resolve-Path .\dist\dingopie_windows_amd64_v1\dingopie.exe).Path
          $exe = $exe -replace '\\', '/'
          echo "dingopie binary found at: $exe"
          make test-windows EXECUTABLE="$exe"
        shell: pwsh
