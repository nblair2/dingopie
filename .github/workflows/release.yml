name: release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Load tool versions
        run: cat .github/versions.env >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install garble
        run: go install mvdan.cc/garble@${{ env.GARBLE_VERSION }}
      - name: Cache garble build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/garble
          key: garble-release-${{ env.GARBLE_VERSION }}-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            garble-release-${{ env.GARBLE_VERSION }}-${{ env.GO_VERSION }}-
      - name: Generate garble seed
        run: |
          SEED=$(openssl rand -base64 8 | tr -d '=')
          echo "GARBLE_SEED=$SEED"
          echo "GARBLE_SEED=$SEED" >> "$GITHUB_ENV"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
