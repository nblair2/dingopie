services:

  outstation:
    image: dingopie-test:latest
    container_name: outstation
    volumes:
      - ${EXECUTABLE}:/usr/local/bin/dingopie:ro
      - ../results:/usr/local/bin/results:rw
    cap_add:
      - NET_ADMIN
    init: true
    command: ["outstation-demo", "20000", "1"]
    stop_grace_period: 1s
    networks:
      test:
        ipv4_address: 192.168.0.10

  master:
    image: dingopie-test:latest
    container_name: master
    volumes:
      - ${EXECUTABLE}:/usr/local/bin/dingopie:ro
      - ../results:/usr/local/bin/results:rw
    cap_add:
      - NET_ADMIN
    init: true
    command: ["master-demo", "outstation", "20000", "0.2"]
    stop_grace_period: 1s
    depends_on:
      - outstation
    networks:
      test:
        ipv4_address: 192.168.0.5

networks:
  test:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dingopie-test
    ipam:
      config:
        - subnet: 192.168.0.0/24