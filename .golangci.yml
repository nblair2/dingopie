version: "2"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - arangolint
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - ginkgolinter
    - gocheckcompilerdirectives
    # - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    # - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    # - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint

  exclusions:
    warn-unused: true
    rules:
      # !TODO: Take this out before merging inject
      - linters:
          - revive
          - errcheck
          - forbidigo
          - mnd
        path: internal/inject/inject.go

      # DNP3 constants
      - linters:
          - mnd
        path: internal/dnp3.go

      # Test files: idiomatic table-driven tests need looser rules
      - linters:
          - mnd
          - exhaustruct
          - funlen
          - gocognit
          - cyclop
          - dupl
          - lll
          - maintidx
        path: _test\.go

      # Do not discourage useful comments
      - linters:
          - godox
        text: Line contains TODO/BUG/FIXME

      # Cobra-isms
      - linters:
          - exhaustruct
          - gochecknoglobals
          - gochecknoinits
        path: cmd/*

      # Specific unhandled errors
      - linters:
          - gosec
        text: "G104: Errors unhandled"
      - linters:
          - errcheck
        text: bar\.
      - linters:
          - errcheck
        text: \.Close
      - linters:
          - errcheck
        text: fmt\.Fprint

  disable:
    - depguard
    - err113
    - gochecknoglobals
    - noctx
    - varnamelen

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
      
